name: Reproduce repository results

on: [push, pull_request, workflow_dispatch]

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiment/requirements.txt
      - run: python -m pip install -r experiment/requirements.txt
      - run: python experiment/reproduce.py
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-validation
          path: |
            experiment/data/processed/
            experiment/figures/

  theory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: theory/requirements.txt
      - run: python -m pip install -r theory/requirements.txt
      - run: python -m pytest -q theory/tests
      - run: python theory/scripts/execute_notebooks.py
      - uses: actions/upload-artifact@v4
        with:
          name: theory-validation
          path: theory/results/

  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: calibration/requirements.txt
      - run: python -m pip install -r calibration/requirements.txt
      - run: python calibration/reproduce.py
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-plots
          path: calibration/figures/
